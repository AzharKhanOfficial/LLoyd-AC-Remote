name: Build Lloyd AC Remote APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: LloydAcRemote

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Check project files
        run: |
          pwd
          ls -la
          ls -la app

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lloyd-ac-remote-debug-apk
          path: LloydAcRemote/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
